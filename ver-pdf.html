<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan en PDF</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .topbar {
      padding: 12px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .topbar a {
      display: inline-block;
      padding: 10px 16px;
      background: #2d6cdf;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }

    .viewer {
      width: 100%;
      height: calc(100% - 64px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a id="pdf-link" href="angelica.pdf" target="_blank">Abrir PDF directamente</a>
  </div>

  <iframe id="pdf-frame" class="viewer" src="angelica.pdf"></iframe>

  <script>
    const PDFS_POR_PERSONA = {
      angelica: "angelica.pdf",
      adrian: "adrian.pdf",
      karina: "karina.pdf"
    };

    const personaSolicitada = new URLSearchParams(window.location.search).get("persona");
    const persona = Object.hasOwn(PDFS_POR_PERSONA, personaSolicitada)
      ? personaSolicitada
      : "angelica";
    const pdf = PDFS_POR_PERSONA[persona];

    document.getElementById("pdf-link").href = pdf;
    document.getElementById("pdf-frame").src = pdf;
  </script>

</body>
</html>
